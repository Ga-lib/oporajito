services:
  - type: web
    name: oporajito-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: oporajito_db
      - key: ALLOW_DEV_TOKENS
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: FIREBASE_CREDENTIALS_PATH
        value: "serviceAccountKey.json"
